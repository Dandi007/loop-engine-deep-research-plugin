# A10b —— 收敛只由板面状态决定；max_nodes 是**非绑定**的失控预算护栏，不是收敛机制（§1.1）。
# 根因（§0.1）：loop-engine 在主循环每圈顶部查 `done.size >= max_nodes ⇒ finish("max_nodes")`，
#   而 fleet 的 claim.complete 把非 {halt,drained} 终局当失败路由回 failure_status:open ⇒
#   seed 每轮被认领又退回 open ⇒ 永不「已排空」。上一版 max_nodes:1（后 2）会让「撞上 max_nodes」
#   成为收敛触发器：板面一旦需 ≥2 个 tick pass（done.size>=max_nodes）就重演该失败循环。
#   修复：把 max_nodes 设成明显非绑定的大值（本板面自然 drain 的 pass 数远小于它），
#   使收敛只由板面状态（tick 依 hasPendingWork 停止续投）确定性推出；max_rounds=16 仍是失控兜底。
#   （B1-guard 收敛成因测试钉死本配置，调回 1/2 即被拦截。）
limits: { max_nodes: 64, wall_clock: 60, node_timeout: 30, max_retries: 0, concurrency: 1 }
harness:
  sh: { runtime: bash, write: false }
seed:
  - identity: tick
    mode: fresh
    template: tick
    harness: sh
    payload:
      tick_entry: "{{tick_entry}}"
      tick_channel: "{{tick_channel}}"
      evidence_channel: "{{evidence_channel?}}"
      allowed_root: "{{allowed_root?}}"
      # A10c —— 写入预算（--max-writes）：由 fleet input 注入 tick.md，再传给 tick-entry --run。
      max_writes: "{{max_writes}}"
      # G4a —— 研究主问题（--question）：由 fleet input 注入 tick.md，再传给 tick-entry --run。
      research_question: "{{research_question}}"
      # G4c —— 研究 origin（--origin）：由 fleet input 注入 tick.md，再传给 tick-entry --run。
      research_origin: "{{research_origin?}}"
      # G4c —— doc channel（--doc-channel）：由 fleet input 注入 tick.md，再传给 tick-entry --run。
      doc_channel: "{{doc_channel?}}"
      # E0c3b §1.1 —— triage 触发阈值（--triage-threshold）：由 fleet input 注入 tick.md，
      # 再传给 tick-entry --run。与 MAX_WRITES 同款装配链（缺省 3）。
      triage_threshold: "{{triage_threshold}}"
      # E0c4 —— 单个 tick 的声明上界（ms），由 profile 声明。缺省空（不设限）。
      tick_timeout_ms: "{{tick_timeout_ms?}}"
      # E0c4 —— 回归基线收窄 maxClues（缺省空，由 tick-entry 的 DEFAULT_TICK_CONFIG.maxClues 兜底）。
      max_clues: "{{max_clues?}}"
      trigger_store_dir: "{{trigger_store_dir}}"
      loop_store_cli: "{{loop_store_cli}}"
      loop_engine_runner: "{{loop_engine_runner}}"
      # G4b —— 续投 trigger 的 body（claim.bind 已把 trigger body 绑进 pipeline input）。
      # 首个 seed 触发的 body 形如 {"seed":true}（无计数字段）；tick.md 判别后对首轮不传 --prev-*。
      # 续投 body 形如 {"tick":true,"coverage":<n>,"zeroGrowthRounds":<m>}；tick.md 解析后传 --prev-*。
      trigger_body: "{{trigger_body}}"
